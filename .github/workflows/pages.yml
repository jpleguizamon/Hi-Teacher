# Testa o app e só depois publica no GitHub Pages (8.41).
# Para valer: Settings → Pages → Source = "GitHub Actions" (uma vez só).
# Se o teste (tests/smoke.js) falhar, a versão nova não vai para o ar.
name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/smoke.js

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # 8.45: publica só os arquivos do app (sem anotações, servidor, testes e ferramentas).
      - run: |
          mkdir -p _site/i18n
          cp index.html sw.js manifest.webmanifest privacidade.html privacy.html _site/
          cp -r icons sounds _site/
          cp i18n/en.js _site/i18n/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
